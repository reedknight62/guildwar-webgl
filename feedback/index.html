<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>GuildWar · 玩家反馈</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <small>GUILDWAR · 反馈入口测试</small>
    <h1>遇到了什么问题？</h1>
    <p>描述发生了什么，以及之前做了什么。环境信息已自动填写。</p>
    <dl id="context"></dl>
    <p id="availability" role="status"></p>
    <form id="form">
      <label for="description">问题描述</label>
      <textarea id="description" required maxlength="4000" placeholder="例如：进入仓库后点击存入，物品没有移动，也没有提示。"></textarea>
      <button id="submit" type="submit" disabled>暂未开通提交</button>
    </form>
    <div id="result" role="status" aria-live="polite"></div>
    <footer>本页用于测试访问与环境信息预填。提交功能接通后，玩家无需登录。</footer>
  </main>
</body>
</html>
