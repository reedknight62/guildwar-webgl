<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | 诸神之弈</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">诸神之弈</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ea153e321edf23b9a40b38d65ce41d01.loader.js";
      var config = {
        dataUrl: buildUrl + "/a685c22314a49e9c4a958c5845af1c20.data",
        frameworkUrl: buildUrl + "/52514baf647c9fe367a85fc5d3b666c2.framework.js",
        codeUrl: buildUrl + "/8226a2c346c0379a25111a3d79ea8350.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "CloudH",
        productName: "诸神之弈",
        productVersion: "1.1.2",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      canvas.style.background = "url('" + buildUrl + "/e2a64a340cca925ebaa14698b97fc8bb.jpg') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
function installGithubChunkTransport(url, manifest) {
  const dataUrl = new URL(url, document.baseURI).href;
  const originalFetch = window.fetch;
  const fetchResource = originalFetch.bind(window);
  const size = manifest.originalSize;
  const chunks = manifest.chunks;
  if (!Number.isSafeInteger(size) || size <= 0 || !Array.isArray(chunks) ||
      !chunks.length || !chunks.every(part => /^\d+$/.test(String(part)))) {
    throw new Error('Invalid build chunk manifest');
  }
  const etag = '"' + new URL(dataUrl).pathname.split('/').pop() + '"';
  const headers = {
    'Content-Type': 'application/octet-stream',
    'Content-Length': String(size),
    'ETag': etag
  };

  function chunkFetch(input, options) {
    const requestedUrl = input instanceof Request ? input.url : new URL(input, document.baseURI).href;
    if (requestedUrl !== dataUrl) return fetchResource(input, options);
    const request = new Request(input, options);
    if (request.method !== 'GET' && request.method !== 'HEAD') return fetchResource(input, options);
    if (request.signal.aborted) return Promise.reject(new DOMException('Aborted', 'AbortError'));
    const conditional = request.headers.get('If-None-Match');
    if (conditional && conditional.split(',').some(value => [etag, 'W/' + etag, '*'].includes(value.trim()))) {
      return Promise.resolve(new Response(null, {status: 304, headers}));
    }
    if (request.method === 'HEAD') return Promise.resolve(new Response(null, {headers}));

    let reader = null;
    let next = 0;
    let received = 0;
    let cancelled = false;
    const stream = new ReadableStream({
      async pull(controller) {
        try {
          while (!cancelled) {
            if (!reader) {
              if (next === chunks.length) {
                if (received !== size) throw new Error('Incomplete build data');
                controller.close();
                return;
              }
              const response = await fetchResource(dataUrl + '.' + chunks[next++], {
                cache: request.cache,
                credentials: request.credentials,
                signal: request.signal
              });
              if (cancelled) {
                if (response.body) await response.body.cancel();
                return;
              }
              if (!response.ok || !response.body) throw new Error('Build chunk request failed: ' + response.status);
              reader = response.body.getReader();
            }
            const part = await reader.read();
            if (cancelled) return;
            if (part.done) {
              reader.releaseLock();
              reader = null;
              continue;
            }
            received += part.value.byteLength;
            if (received > size) throw new Error('Build data exceeds manifest size');
            controller.enqueue(part.value);
            return;
          }
        } catch (error) {
          if (reader) await reader.cancel(error).catch(() => {});
          if (!cancelled) controller.error(error);
        }
      },
      cancel(reason) {
        cancelled = true;
        return reader ? reader.cancel(reason) : undefined;
      }
    });
    return Promise.resolve(new Response(stream, {headers}));
  }

  window.fetch = chunkFetch;
  return function restore() {
    if (window.fetch === chunkFetch) window.fetch = originalFetch;
  };
}

        function startUnity(cfg) {
          return createUnityInstance(canvas, cfg, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }).catch((message) => {
            alert(message);
          });
        }
        // GitHub Pages: stream the existing chunks without allocating one giant Blob.
        fetch(config.dataUrl + '.manifest', {cache:'no-cache'})
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(m){
            if (m && m.chunked) {
              const restoreFetch = installGithubChunkTransport(config.dataUrl, m);
              startUnity(config).finally(restoreFetch);
            } else { startUnity(config); }
          })
          .catch(function(){ startUnity(config); });
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
