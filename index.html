    stats.resources[item.name] = state;
    records.set(url, {manifest, state, cached: new Set(), stored: new Set(), disableWrites: false});
  }

  function webFetch(input, init) {
    const url = input instanceof Request ? input.url : new URL(input, document.baseURI).href;
    const record = records.get(url);
    if (!record) return fetchResource(input, init);
    const request = new Request(input, init);

          controller.enqueue(bytes);

          abort.abort(error); cleanup(); controller.error(error);

      cancel(reason) {

        abort.abort(reason); cleanup();

    const body = compressed.pipeThrough(decoder(state)).pipeThrough(new TransformStream({
      transform(bytes, controller) {
        decoded += bytes.byteLength; state.decodedBytes = decoded;
        if (decoded > manifest.originalSize) throw new Error('Decoded build exceeds original size');
        controller.enqueue(bytes);

      flush() {
        cleanup();

        state.persistentReady = new Set([...record.cached, ...record.stored]).size === manifest.chunks.length;

    }));
    return Promise.resolve(new Response(body, {headers}));
  }

  window.fetch = webFetch;
  return function restore() {
    if (window.fetch === webFetch) window.fetch = originalFetch;
  };
}
